<div class="modal-header">
  <h5 class="modal-title"
      i18n="@@shareModal.title">
    Share
  </h5>
  <button type="button"
          class="btn-close"
          (click)="modal.dismiss()"
          aria-label="Close"
          i18n-aria-label="@@shareModal.close"></button>
</div>
<div class="modal-body">
  <div>{{ data()?.text }}</div>
</div>
<div class="modal-footer">
  <button type="button"
          class="btn btn-primary"
          (click)="copy()">
    <i class="bi-copy me-2"></i>
    <span i18n="@@shareModal.copyToClipboard">Copy to clipboard</span>
  </button>
</div>
