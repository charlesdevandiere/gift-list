<div class="container h-100 overflow-hidden">
  <div class="row h-100">
    <div class="col-12 offset-md-2 col-md-8 offset-lg-3 col-lg-6 offset-xl-4 col-xl-4 mt-3 h-100">
      <div class="d-flex flex-column h-100">
        <h4 class="text-center"
            i18n="@@signInPage.title">
          Sign in to Gift list
        </h4>
        <div class="card overflow-auto mb-5">
          <form class="card-body"
                [formGroup]="form"
                (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="username"
                     class="form-label"
                     i18n="@@signInPage.username">
                Username
              </label>
              <input type="text"
                     class="form-control"
                     id="username"
                     formControlName="username" />
            </div>
            <div class="mb-3">
              <label for="password"
                     class="form-label"
                     i18n="@@signInPage.password">
                Password
              </label>
              <input type="password"
                     class="form-control"
                     id="password"
                     formControlName="password" />
            </div>
            <div class="text-end">
              <button type="submit"
                      class="btn btn-primary"
                      [disabled]="!form.valid"
                      i18n="@@signInPage.signIn">
                Sign in
              </button>
            </div>
            @if (error(); as err) {
              <div class="alert alert-danger mt-3 mb-0"
                   role="alert">
                {{ err }}
              </div>
            }
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
